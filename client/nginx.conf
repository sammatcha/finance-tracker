server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://server:8081;
        proxy_set_header Host $host;
    }

    location /entries {
        proxy_pass http://server:8081;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
