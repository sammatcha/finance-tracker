server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /health {
        set $api http://server:8081;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location /entries {
        set $api http://server:8081;
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
